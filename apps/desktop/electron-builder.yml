appId: com.fairy.assistant
productName: Fairy
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
# better-sqlite3 v13 自带 N-API prebuilds（ABI 稳定，node/electron 通用），
# 无需 electron-rebuild（本机无 VS Build Tools，重建会直接报错）
npmRebuild: false
# extraResources：托盘/窗口图标（main 按进程路径解析）
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # 自定义脚本：开机自启选项（默认勾选）+ 卸载清理自启项（阶段 6 / DEV_PLAN §6.6.1）
  include: installer.nsh
portable:
  # 单 EXE 免安装版（阶段 6 / DEV_PLAN §6.6.1）
  artifactName: 'Fairy-${version}-portable.${ext}'
publish: null
